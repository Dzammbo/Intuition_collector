name: Collect Tennis Singles Event View

on:
  push:
    branches: [main]
    paths: ['triggers/run-event-view.txt']
  workflow_dispatch:
    inputs:
      universe_run_id:
        description: GitHub Actions run id containing classified tennis universe
        required: true
        type: string
      l1_run_id:
        description: GitHub Actions run id containing L1 market scan
        required: true
        type: string
      date_moscow:
        description: Canonical Moscow day in YYYY-MM-DD format
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BETSAPI_TOKEN: ${{ secrets.BETS_API }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate explicit inputs
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            UNIVERSE_RUN=$(sed -n "1p" triggers/run-event-view.txt)
            L1_RUN=$(sed -n "2p" triggers/run-event-view.txt)
            DAY=$(sed -n "3p" triggers/run-event-view.txt)
          else
            UNIVERSE_RUN="${{ inputs.universe_run_id }}"
            L1_RUN="${{ inputs.l1_run_id }}"
            DAY="${{ inputs.date_moscow }}"
          fi
          [[ "$UNIVERSE_RUN" =~ ^[0-9]+$ ]]
          [[ "$L1_RUN" =~ ^[0-9]+$ ]]
          [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          echo "UNIVERSE_RUN=$UNIVERSE_RUN" >> "$GITHUB_ENV"
          echo "L1_RUN=$L1_RUN" >> "$GITHUB_ENV"
          echo "DAY=$DAY" >> "$GITHUB_ENV"
      - name: Download classified tennis universe
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.UNIVERSE_RUN }}
          pattern: '*universe*'
          merge-multiple: true
      - name: Download L1 market scan
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.L1_RUN }}
          pattern: 'l1-market-scan-*'
          merge-multiple: true
          path: l1
      - name: Verify complete singles inputs
        run: |
          set -euo pipefail
          test -f classified-universe.json
          test -f l1/l1-market-raw.json
          python3 - <<'PY'
          import json
          u = json.load(open("classified-universe.json"))
          l = json.load(open("l1/l1-market-raw.json"))
          singles = u.get("events", {}).get("TENNIS_SINGLES")
          assert isinstance(singles, list)
          assert u.get("tiering_used") is False
          assert l.get("stage") == "TENNIS_SINGLES_L1_MARKET_SCAN"
          assert l.get("input_singles") == len(singles)
          assert l.get("completed") == len(singles)
          print({"singles": len(singles), "l1_completed": l["completed"], "l1_errors": len(l.get("errors") or [])})
          PY
      - name: Collect Event View for every singles event
        run: python3 collect_event_view.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-view-singles-${{ env.DAY }}
          path: event-view-singles.json
          if-no-files-found: error
          retention-days: 7
