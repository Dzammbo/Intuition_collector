name: Collect CORE Event View

on:
  push:
    branches: [main]
    paths: ['triggers/run-enrichment-2026-09-28.txt']
  workflow_dispatch:
    inputs:
      source_run_id:
        description: GitHub Actions run id containing the final classified Universe artifact
        required: true
        type: string
      date_moscow:
        description: Canonical Moscow day in YYYY-MM-DD format
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BETSAPI_TOKEN: ${{ secrets.BETS_API }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate explicit inputs
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then SRC=$(sed -n "1p" triggers/run-enrichment-2026-09-28.txt); DAY=$(sed -n "2p" triggers/run-enrichment-2026-09-28.txt); else SRC="${{ inputs.source_run_id }}"; DAY="${{ env.DAY }}"; fi
          [[ "$SRC" =~ ^[0-9]+$ ]]
          [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          echo "SRC=$SRC" >> "$GITHUB_ENV"
          echo "DAY=$DAY" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SRC }}
          pattern: '*universe*'
          merge-multiple: true
      - name: Verify CORE input
        run: |
          set -euo pipefail
          test -f classified-universe.json
          python3 - <<'PY'
          import json
          d = json.load(open("classified-universe.json"))
          core = d.get("events", {}).get("CORE")
          assert isinstance(core, list) and core
          print({"core": len(core)})
          PY
      - run: python3 collect_event_view.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-view-core-${{ env.DAY }}
          path: event-view-core.json
          if-no-files-found: error
          retention-days: 7
