name: Run Deep Research Timing Check

on:
  workflow_dispatch:
    inputs:
      date_moscow:
        description: Canonical Moscow card date in YYYY-MM-DD format
        required: true
        type: string
      card_key:
        description: Optional immutable card/run key for same-day reruns
        required: false
        type: string
      expected_matches:
        description: Expected complete pre-deep event count
        required: true
        type: string
  push:
    branches: [main]
    paths: ['triggers/run-deep-research-timing-check.txt']

permissions:
  contents: read

concurrency:
  group: persist-deep-research-timing-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve explicit inputs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            DAY="$(sed -n '1p' triggers/run-deep-research-timing-check.txt)"
            EXPECTED="$(sed -n '2p' triggers/run-deep-research-timing-check.txt)"
            CARD_KEY="$(sed -n '3p' triggers/run-deep-research-timing-check.txt)"
          else
            DAY="${{ inputs.date_moscow }}"
            EXPECTED="${{ inputs.expected_matches }}"
            CARD_KEY="${{ inputs.card_key }}"
          fi
          [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          if [ -z "$CARD_KEY" ]; then CARD_KEY="$DAY"; fi
          [[ "$CARD_KEY" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$EXPECTED" =~ ^[1-9][0-9]*$ ]]
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          echo "CARD_KEY=$CARD_KEY" >> "$GITHUB_ENV"
          echo "EXPECTED=$EXPECTED" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          repository: Dzammbo/jarvis-intuition
          token: ${{ secrets.JARVIS_PRIVATE_REPO_TOKEN }}
          path: state

      - name: Verify complete pre-deep source
        shell: bash
        run: |
          set -euo pipefail
          test -f "state/status/pre-deep-enrichment-$CARD_KEY.json"
          test -f "state/player_dossiers/$CARD_KEY/pre-deep-research-enrichment.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          card_key = os.environ["CARD_KEY"]
          expected = int(os.environ["EXPECTED"])
          status = json.loads((Path("state/status") / f"pre-deep-enrichment-{card_key}.json").read_text())
          source = json.loads((Path("state/player_dossiers") / card_key / "pre-deep-research-enrichment.json").read_text())
          assert status["status"] == "SUCCESS"
          assert status["coverage"]["output_events"] == expected
          assert source["stage"] == "TENNIS_PRE_DEEP_RESEARCH_ENRICHMENT"
          assert source["coverage"]["output_events"] == expected
          assert len(source["events"]) == expected
          print({"eligible_matches": expected, "source_unresolved": source["coverage"]["unresolved"]})
          PY

      - name: Apply timing gate to every event
        shell: bash
        run: |
          set -euo pipefail
          python3 apply_deep_research_timing_check.py             --input "state/player_dossiers/$CARD_KEY/pre-deep-research-enrichment.json"             --output deep-research-timing-check.json

      - name: Validate timing-check contract
        shell: bash
        run: |
          set -euo pipefail
          python3 state/scripts/validate_deep_research_timing_check.py             deep-research-timing-check.json
          python3 - <<'PY'
          import json
          import os

          expected = int(os.environ["EXPECTED"])
          data = json.load(open("deep-research-timing-check.json"))
          assert data["coverage"]["input_events"] == expected
          assert data["coverage"]["output_events"] == expected
          assert data["coverage"]["time_gate_pass"] + data["coverage"]["cleared_for_price_blind_sporting_freeze"] == expected
          print(data["coverage"])
          PY

      - name: Persist timing check to canonical state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "state/assessment_inputs/$CARD_KEY"
          cp deep-research-timing-check.json             "state/assessment_inputs/$CARD_KEY/deep-research-timing-check.json"
          cd state
          git config user.name "Jarvis Intuition Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "assessment_inputs/$CARD_KEY/deep-research-timing-check.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist $CARD_KEY deep-research timing check"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: deep-research-timing-check-${{ env.CARD_KEY }}-run-${{ github.run_id }}
          path: deep-research-timing-check.json
          if-no-files-found: error
          retention-days: 7
