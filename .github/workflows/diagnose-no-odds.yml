name: Diagnose Saved NO ODDS
on:
  push:
    branches: [main]
    paths: ['triggers/run-no-odds-diagnostic.txt']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: l1-market-scan-2026-09-27
          github-token: ${{ github.token }}
          run-id: 36312903767
      - run: python3 diagnose_no_odds.py
      - uses: actions/upload-artifact@v4
        with:
          name: no-odds-diagnostic-2026-09-27
          path: no-odds-diagnostic.json
