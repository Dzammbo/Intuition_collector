name: Prepare Tennis Day (Manual)

on:
  workflow_dispatch:
    inputs:
      date_moscow:
        description: Optional Moscow card date in YYYY-MM-DD format
        required: false
        type: string
      window_start_utc:
        description: Optional exact UTC start for a rolling 24h window
        required: false
        type: string
      exclude_final_portfolio_ref:
        description: Optional canonical final portfolio whose selected event IDs must be excluded
        required: false
        type: string
  push:
    branches: [main]
    paths: [triggers/run-prepare-tennis-day.json]

permissions:
  contents: read

concurrency:
  group: prepare-tennis-day
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BETSAPI_TOKEN: ${{ secrets.BETS_API }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Moscow card date and exact window
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            REQUEST_FILE="triggers/run-prepare-tennis-day.json"
            DAY="$(python3 -c 'import json; print(json.load(open("triggers/run-prepare-tennis-day.json")).get("date_moscow", ""))')"
            WINDOW_START="$(python3 -c 'import json; print(json.load(open("triggers/run-prepare-tennis-day.json")).get("window_start_utc", ""))')"
            WINDOW_MODE="$(python3 -c 'import json; print(json.load(open("triggers/run-prepare-tennis-day.json")).get("window_mode", ""))')"
            EXCLUDE_REF="$(python3 -c 'import json; print(json.load(open("triggers/run-prepare-tennis-day.json")).get("exclude_final_portfolio_ref", ""))')"
          else
            DAY="${{ inputs.date_moscow }}"
            WINDOW_START="${{ inputs.window_start_utc }}"
            WINDOW_MODE=""
            EXCLUDE_REF="${{ inputs.exclude_final_portfolio_ref }}"
          fi
          if [ -z "$DAY" ]; then
            DAY="$(TZ=Europe/Moscow date +%F)"
          fi
          [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          if [ -z "$WINDOW_START" ]; then
            if [ "$WINDOW_MODE" = "ROLLING_24H_FROM_RUN_START" ]; then
              WINDOW_START="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            else
              WINDOW_START="$(DAY="$DAY" python3 - <<'PY'
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          day = datetime.strptime(os.environ["DAY"], "%Y-%m-%d").replace(tzinfo=ZoneInfo("Europe/Moscow"))
          print(day.astimezone(timezone.utc).isoformat().replace("+00:00", "Z"))
          PY
              )"
            fi
          fi
          WINDOW_START="$WINDOW_START" python3 -c 'from datetime import datetime; import os; datetime.fromisoformat(os.environ["WINDOW_START"].replace("Z", "+00:00"))'
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          echo "CARD_WINDOW_START_UTC=$WINDOW_START" >> "$GITHUB_ENV"
          echo "EXCLUDE_FINAL_PORTFOLIO_REF=$EXCLUDE_REF" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: Dzammbo/jarvis-intuition
          token: ${{ secrets.JARVIS_PRIVATE_REPO_TOKEN }}
          path: state

      - name: Collect and classify complete 24h tennis universe
        shell: bash
        run: |
          set -euo pipefail
          test -n "${BETSAPI_TOKEN:-}"
          python3 collector.py
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          universe_path = Path("universe.json")
          universe = json.loads(universe_path.read_text())
          ref = os.environ.get("EXCLUDE_FINAL_PORTFOLIO_REF", "").strip()
          if ref:
              portfolio_path = Path("state") / ref
              if not portfolio_path.is_file():
                  raise SystemExit(f"exclusion portfolio not found: {ref}")
              portfolio = json.loads(portfolio_path.read_text())
              excluded = {str(row["event_id"]) for row in portfolio.get("selections", []) if row.get("event_id") is not None}
              before = universe.get("window_events") or []
              after = [row for row in before if str(row.get("id")) not in excluded]
              matched = sorted({str(row.get("id")) for row in before if str(row.get("id")) in excluded})
              universe["window_events"] = after
              universe["window_event_count"] = len(after)
              universe["exclusion"] = {
                  "mode": "EXCLUDE_PREVIOUSLY_SELECTED_PROVIDER_EVENT_IDS",
                  "source_ref": ref,
                  "requested_event_ids": len(excluded),
                  "matched_and_excluded": len(matched),
                  "excluded_event_ids": matched,
              }
              universe_path.write_text(json.dumps(universe, ensure_ascii=False))
              print(json.dumps(universe["exclusion"], ensure_ascii=False))
          PY
          python3 classify_universe.py

      - name: Collect prices and Event View
        shell: bash
        run: |
          set -euo pipefail
          python3 l1_market_scan.py
          mkdir -p l1
          cp l1-market-raw.json l1/l1-market-raw.json
          python3 collect_event_view.py
          python3 build_model_prescreen_packet.py l1-market-raw.json event-view-singles.json

      - name: Download frozen historical tennis archive
        shell: bash
        run: |
          set -euo pipefail
          for year in 2024 2025 2026; do
            curl --fail --location --retry 3 --silent --show-error               "https://www.valuebetennis.com/datasets/valuebetennis-matchs-${year}.csv"               --output "valuebetennis-matchs-${year}.csv"
          done

      - name: Capture complete ATP and WTA singles rankings
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
          mkdir -p rankings
          : > rankings/atp-rankings.html
          for page in $(seq 1 50); do
            curl --fail --location --retry 3 --silent --show-error \
              -A 'Mozilla/5.0' \
              "https://www.tennisexplorer.com/ranking/atp-men/?page=$page&sort=rank" \
              >> rankings/atp-rankings.html
          done
          curl --fail --location --retry 3 --silent --show-error \
            'https://wtafiles.wtatennis.com/pdf/rankings/Singles_Numeric.pdf' \
            --output rankings/wta-rankings.pdf
          pdftotext -layout rankings/wta-rankings.pdf rankings/wta-rankings.txt
          python3 collect_tennis_rankings.py \
            --atp-html rankings/atp-rankings.html \
            --wta-text rankings/wta-rankings.txt \
            --atp-pages 50 \
            --output-dir rankings

      - name: Build separated baseline dossier layers
        shell: bash
        run: |
          set -euo pipefail
          PROFILE_ARGS=()
          if [ -f state/player_dossiers/player-profiles.json ]; then
            PROFILE_ARGS=(--previous-profile-snapshot state/player_dossiers/player-profiles.json)
          fi
          python3 collect_tennis_profiles.py \
            --universe classified-universe.json \
            --output rankings/player-profiles.json \
            "${PROFILE_ARGS[@]}"
          PREVIOUS_ARGS=()
          if [ -f state/player_dossiers/player-history.json ]; then
            PREVIOUS_ARGS=(--previous-player-history state/player_dossiers/player-history.json)
          fi
          python3 build_player_dossiers.py \
            --universe classified-universe.json \
            --event-view event-view-singles.json \
            --matches valuebetennis-matchs-2024.csv valuebetennis-matchs-2025.csv valuebetennis-matchs-2026.csv \
            --materialized-at-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --ranking-snapshots rankings/atp-ranking.json rankings/wta-ranking.json \
            --profile-snapshot rankings/player-profiles.json \
            --history-output player-history.json \
            --snapshot-output baseline-history-snapshot.json \
            --match-context-output match-context-snapshots.json \
            --manifest-output baseline-dossier-manifest.json \
            "${PREVIOUS_ARGS[@]}"

      - name: Build non-scoring pre-deep-research enrichment
        shell: bash
        run: |
          set -euo pipefail
          ENRICH_ARGS=()
          if [ -f "state/player_dossiers/$DAY/pre-deep-research-enrichment.json" ]; then
            ENRICH_ARGS+=(--previous-enrichment "state/player_dossiers/$DAY/pre-deep-research-enrichment.json")
          fi
          if [ -f "state/player_dossiers/$DAY/external-observations.json" ]; then
            ENRICH_ARGS+=(--external-observations "state/player_dossiers/$DAY/external-observations.json")
          fi
          python3 enrich_player_dossiers.py \
            --history-snapshot baseline-history-snapshot.json \
            --match-context match-context-snapshots.json \
            --output pre-deep-research-enrichment.json \
            "${ENRICH_ARGS[@]}"
      - name: Build assessment index and readiness audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          day = os.environ["DAY"]
          packet = json.loads(Path("model-prescreen-packet.json").read_text())
          universe = json.loads(Path("universe.json").read_text())
          history_snapshot = json.loads(Path("baseline-history-snapshot.json").read_text())
          match_context = json.loads(Path("match-context-snapshots.json").read_text())
          dossier_manifest = json.loads(Path("baseline-dossier-manifest.json").read_text())
          enrichment = json.loads(Path("pre-deep-research-enrichment.json").read_text())
          cards = packet["cards"]
          rows = []
          for index, card in enumerate(cards, 1):
              rows.append({
                  "candidate_index": index,
                  "ordinal": card.get("ordinal") or index,
                  "event_id": str(card["event_id"]),
                  "scope_status": "TENNIS_SINGLES",
                  "price_gate_status": card.get("price_gate_status"),
                  "sport_id": "13",
                  "league": card.get("league"),
                  "home": card.get("home"),
                  "away": card.get("away"),
                  "start_time": card.get("start_time"),
                  "player_refs": card.get("player_refs") or [],
              })

          starts = [int(row["start_time"]) for row in rows if str(row.get("start_time") or "").isdigit()]
          now = datetime.now(timezone.utc)
          earliest = min(starts) if starts else None
          lead_seconds = earliest - int(now.timestamp()) if earliest else None
          readiness = {
              "schema_version": 1,
              "date_moscow": day,
              "stage": "MACHINE_PREPARATION_COMPLETE",
              "status": "READY_FOR_ASSESSMENT" if rows else "NO_ELIGIBLE_EVENTS",
              "prepared_at_utc": now.isoformat(),
              "source_captured_at_utc": universe["captured_at"],
              "exclusion": universe.get("exclusion"),
              "card_window_start_utc": datetime.fromtimestamp(universe["window_start"], timezone.utc).isoformat(),
              "card_window_end_utc": datetime.fromtimestamp(universe["window_end"], timezone.utc).isoformat(),
              "eligible_singles": len(rows),
              "price_ready": sum(row["price_gate_status"] == "PRICE_READY" for row in rows),
              "waiting_for_price": sum(row["price_gate_status"] == "WAITING_FOR_PRICE" for row in rows),
              "dossier_classification": dossier_manifest["classification"],
              "dossier_players": len(history_snapshot.get("players") or []),
              "match_contexts": len(match_context.get("events") or []),
              "pre_deep_enrichment_events": len(enrichment.get("events") or []),
              "ranking_pages_complete": dossier_manifest["coverage"]["ranking_pages_complete"],
              "earliest_start_utc": datetime.fromtimestamp(earliest, timezone.utc).isoformat() if earliest else None,
              "lead_to_first_start_seconds": lead_seconds,
              "timing_status": "NO_ELIGIBLE_EVENTS" if lead_seconds is None else ("PREMATCH_READY" if lead_seconds >= 0 else "MISSED_EARLIEST_START"),
              "assessment_order": "EARLIEST_START_FIRST_ROLLING_BATCHES",
              "full_packet_wait_before_first_assessment": False,
          }

          root = Path("state")
          index_path = root / f"assessment_inputs/{day}/assessment-candidate-index.json"
          packet_path = root / f"candidate_screen_inputs/{day}/tennis-singles-research-packet.json"
          profile_registry_path = root / "player_dossiers/player-profiles.json"
          history_registry_path = root / "player_dossiers/player-history.json"
          history_snapshot_path = root / f"player_dossiers/{day}/baseline-history-snapshot.json"
          match_context_path = root / f"player_dossiers/{day}/match-context-snapshots.json"
          dossier_manifest_path = root / f"player_dossiers/{day}/baseline-dossier-manifest.json"
          enrichment_path = root / f"player_dossiers/{day}/pre-deep-research-enrichment.json"
          status_path = root / f"status/preflight-{day}.json"
          for path in (index_path, packet_path, profile_registry_path, history_registry_path, history_snapshot_path, match_context_path, dossier_manifest_path, enrichment_path, status_path):
              path.parent.mkdir(parents=True, exist_ok=True)

          index_path.write_text(json.dumps({
              "schema_version": 3,
              "date_moscow": day,
              "scope": "ALL_REAL_TENNIS_SINGLES",
              "tiering_used": False,
              "count": len(rows),
              "assessment_order": "EARLIEST_START_FIRST_ROLLING_BATCHES",
              "candidates": rows,
          }, ensure_ascii=False, indent=2) + "\n")
          packet_path.write_text(json.dumps(packet, ensure_ascii=False, indent=2) + "\n")
          profile_registry_path.write_text(Path("rankings/player-profiles.json").read_text())
          history_registry_path.write_text(Path("player-history.json").read_text())
          history_snapshot_path.write_text(json.dumps(history_snapshot, ensure_ascii=False, indent=2) + "\n")
          match_context_path.write_text(json.dumps(match_context, ensure_ascii=False, indent=2) + "\n")
          dossier_manifest_path.write_text(json.dumps(dossier_manifest, ensure_ascii=False, indent=2) + "\n")
          enrichment_path.write_text(json.dumps(enrichment, ensure_ascii=False, indent=2) + "\n")
          status_path.write_text(json.dumps(readiness, ensure_ascii=False, indent=2) + "\n")
          print(json.dumps(readiness, ensure_ascii=False))
          PY

      - name: Persist prepared day to canonical repository
        shell: bash
        run: |
          set -euo pipefail
          cd state
          git config user.name "Jarvis Intuition Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            "assessment_inputs/$DAY/assessment-candidate-index.json" \
            "candidate_screen_inputs/$DAY/tennis-singles-research-packet.json" \
            "player_dossiers/player-profiles.json" \
            "player_dossiers/player-history.json" \
            "player_dossiers/$DAY/baseline-history-snapshot.json" \
            "player_dossiers/$DAY/match-context-snapshots.json" \
            "player_dossiers/$DAY/baseline-dossier-manifest.json" \
            "player_dossiers/$DAY/pre-deep-research-enrichment.json" \
            "status/preflight-$DAY.json"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Prepare $DAY tennis assessment before first start"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-tennis-day-${{ env.DAY }}
          path: |
            universe.json
            classified-universe.json
            l1-market-raw.json
            event-view-singles.json
            model-prescreen-packet.json
            player-history.json
            baseline-history-snapshot.json
            match-context-snapshots.json
            baseline-dossier-manifest.json
            pre-deep-research-enrichment.json
            rankings/manifest.json
            rankings/player-profiles.json
          if-no-files-found: error
          retention-days: 7

