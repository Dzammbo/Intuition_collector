name: Prepare Tennis Day

on:
  schedule:
    - cron: '20 18 * * *'
    - cron: '40 18 * * *'
  workflow_dispatch:
    inputs:
      date_moscow:
        description: Optional Moscow card date in YYYY-MM-DD format
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-tennis-day
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BETSAPI_TOKEN: ${{ secrets.BETS_API }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Moscow card date
        shell: bash
        run: |
          set -euo pipefail
          DAY="${{ inputs.date_moscow }}"
          if [ -z "$DAY" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              DAY="$(TZ=Europe/Moscow date -d 'tomorrow' +%F)"
            else
              DAY="$(TZ=Europe/Moscow date +%F)"
            fi
          fi
          [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          CARD_WINDOW_START_UTC="$(DAY="$DAY" python3 - <<'PY'
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          day = datetime.strptime(os.environ["DAY"], "%Y-%m-%d").replace(tzinfo=ZoneInfo("Europe/Moscow"))
          print(day.astimezone(timezone.utc).isoformat().replace("+00:00", "Z"))
          PY
          )"
          echo "CARD_WINDOW_START_UTC=$CARD_WINDOW_START_UTC" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          repository: Dzammbo/jarvis-intuition
          token: ${{ secrets.JARVIS_PRIVATE_REPO_TOKEN }}
          path: state

      - name: Skip fallback when canonical preflight is already safely ready
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          day = os.environ["DAY"]
          path = Path("state") / f"status/preflight-{day}.json"
          skip = False
          if path.exists():
              try:
                  data = json.loads(path.read_text())
                  skip = (
                      data.get("status") in {"READY_FOR_ASSESSMENT", "NO_ELIGIBLE_EVENTS"}
                      and (data.get("lead_to_first_start_seconds") is None or int(data["lead_to_first_start_seconds"]) >= 7200)
                  )
              except Exception:
                  skip = False
          with open(os.environ["GITHUB_ENV"], "a") as handle:
              handle.write(f"SKIP_PREPARE={'true' if skip else 'false'}\n")
          print({"date_moscow": day, "skip_prepare": skip, "preflight": str(path)})
          PY

      - name: Collect and classify complete 24h tennis universe
        if: env.SKIP_PREPARE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${BETSAPI_TOKEN:-}"
          python3 collector.py
          python3 classify_universe.py

      - name: Collect prices and Event View
        if: env.SKIP_PREPARE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 l1_market_scan.py
          mkdir -p l1
          cp l1-market-raw.json l1/l1-market-raw.json
          python3 collect_event_view.py
          python3 build_model_prescreen_packet.py l1-market-raw.json event-view-singles.json

      - name: Download frozen historical tennis archive
        if: env.SKIP_PREPARE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for year in 2024 2025 2026; do
            curl --fail --location --retry 3 --silent --show-error               "https://www.valuebetennis.com/datasets/valuebetennis-matchs-${year}.csv"               --output "valuebetennis-matchs-${year}.csv"
          done

      - name: Capture optional provider ranking snapshots
        if: env.SKIP_PREPARE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for type in 1 3; do
            curl --location --retry 3 --silent --show-error               "https://api.b365api.com/v1/tennis/ranking?token=$BETSAPI_TOKEN&type_id=$type"               --output "betsapi-ranking-$type.raw" || true
            TYPE="$type" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          kind = os.environ["TYPE"]
          raw = Path(f"betsapi-ranking-{kind}.raw")
          try:
              payload = json.loads(raw.read_text(encoding="utf-8"))
          except Exception:
              payload = {"success": 0, "results": []}
          if payload.get("success") != 1 or not isinstance(payload.get("results"), list):
              payload = {"success": 0, "results": []}
          Path(f"betsapi-ranking-{kind}.json").write_text(
              json.dumps(payload), encoding="utf-8"
          )
          PY
          done

      - name: Build immutable player dossiers
        if: env.SKIP_PREPARE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 build_player_dossiers.py             --universe classified-universe.json             --matches valuebetennis-matchs-2024.csv valuebetennis-matchs-2025.csv valuebetennis-matchs-2026.csv             --output full-player-dossiers.json             --materialized-at-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             --ranking-snapshots betsapi-ranking-1.json betsapi-ranking-3.json

      - name: Build assessment index and readiness audit
        if: env.SKIP_PREPARE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          day = os.environ["DAY"]
          packet = json.loads(Path("model-prescreen-packet.json").read_text())
          universe = json.loads(Path("universe.json").read_text())
          dossiers = json.loads(Path("full-player-dossiers.json").read_text())
          cards = packet["cards"]
          rows = []
          for index, card in enumerate(cards, 1):
              rows.append({
                  "candidate_index": index,
                  "ordinal": card.get("ordinal") or index,
                  "event_id": str(card["event_id"]),
                  "scope_status": "TENNIS_SINGLES",
                  "price_gate_status": card.get("price_gate_status"),
                  "sport_id": "13",
                  "league": card.get("league"),
                  "home": card.get("home"),
                  "away": card.get("away"),
                  "start_time": card.get("start_time"),
                  "player_refs": card.get("player_refs") or [],
              })

          starts = [int(row["start_time"]) for row in rows if str(row.get("start_time") or "").isdigit()]
          now = datetime.now(timezone.utc)
          earliest = min(starts) if starts else None
          lead_seconds = earliest - int(now.timestamp()) if earliest else None
          readiness = {
              "schema_version": 1,
              "date_moscow": day,
              "stage": "MACHINE_PREPARATION_COMPLETE",
              "status": "READY_FOR_ASSESSMENT" if rows else "NO_ELIGIBLE_EVENTS",
              "prepared_at_utc": now.isoformat(),
              "source_captured_at_utc": universe["captured_at"],
              "card_window_start_utc": datetime.fromtimestamp(universe["window_start"], timezone.utc).isoformat(),
              "card_window_end_utc": datetime.fromtimestamp(universe["window_end"], timezone.utc).isoformat(),
              "eligible_singles": len(rows),
              "price_ready": sum(row["price_gate_status"] == "PRICE_READY" for row in rows),
              "waiting_for_price": sum(row["price_gate_status"] == "WAITING_FOR_PRICE" for row in rows),
              "dossier_players": len(dossiers.get("players") or []),
              "earliest_start_utc": datetime.fromtimestamp(earliest, timezone.utc).isoformat() if earliest else None,
              "lead_to_first_start_seconds": lead_seconds,
              "timing_status": "ON_TIME" if lead_seconds is None or lead_seconds >= 7200 else "AT_RISK",
              "assessment_order": "EARLIEST_START_FIRST_ROLLING_BATCHES",
              "full_packet_wait_before_first_assessment": False,
          }

          root = Path("state")
          index_path = root / f"assessment_inputs/{day}/assessment-candidate-index.json"
          packet_path = root / f"candidate_screen_inputs/{day}/tennis-singles-research-packet.json"
          dossier_path = root / f"player_dossiers/{day}/multi-source-snapshots.json"
          status_path = root / f"status/preflight-{day}.json"
          for path in (index_path, packet_path, dossier_path, status_path):
              path.parent.mkdir(parents=True, exist_ok=True)

          index_path.write_text(json.dumps({
              "schema_version": 3,
              "date_moscow": day,
              "scope": "ALL_REAL_TENNIS_SINGLES",
              "tiering_used": False,
              "count": len(rows),
              "assessment_order": "EARLIEST_START_FIRST_ROLLING_BATCHES",
              "candidates": rows,
          }, ensure_ascii=False, indent=2) + "\n")
          packet_path.write_text(json.dumps(packet, ensure_ascii=False, indent=2) + "\n")
          dossier_path.write_text(json.dumps(dossiers, ensure_ascii=False, indent=2) + "\n")
          status_path.write_text(json.dumps(readiness, ensure_ascii=False, indent=2) + "\n")
          print(json.dumps(readiness, ensure_ascii=False))
          PY

      - name: Persist prepared day to canonical repository
        if: env.SKIP_PREPARE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd state
          git config user.name "Jarvis Intuition Bot"
          git config user.email "actions@users.noreply.github.com"
          git add             "assessment_inputs/$DAY/assessment-candidate-index.json"             "candidate_screen_inputs/$DAY/tennis-singles-research-packet.json"             "player_dossiers/$DAY/multi-source-snapshots.json"             "status/preflight-$DAY.json"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Prepare $DAY tennis assessment before first start"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        if: always() && env.SKIP_PREPARE != 'true'
        with:
          name: prepared-tennis-day-${{ env.DAY }}
          path: |
            universe.json
            classified-universe.json
            l1-market-raw.json
            event-view-singles.json
            model-prescreen-packet.json
            full-player-dossiers.json
          if-no-files-found: error
          retention-days: 7
