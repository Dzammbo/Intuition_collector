name: Check Final Card Settlement

on:
  workflow_dispatch:
    inputs:
      date_moscow:
        description: YYYY-MM-DD
        required: true
        type: string
  push:
    branches: [main]
    paths: [triggers/run-final-card-check.txt]

permissions:
  contents: read

concurrency:
  group: public-final-card-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BETSAPI_TOKEN: ${{ secrets.BETS_API }}
      PRIVATE_REPO_TOKEN: ${{ secrets.JARVIS_PRIVATE_REPO_TOKEN }}
    steps:
      - name: Verify required secrets
        run: |
          set -euo pipefail
          test -n "${BETSAPI_TOKEN:-}" || { echo "BETS_API secret is missing"; exit 1; }
          test -n "${PRIVATE_REPO_TOKEN:-}" || { echo "JARVIS_PRIVATE_REPO_TOKEN secret is missing"; exit 1; }
      - uses: actions/checkout@v4
        with:
          path: ops
      - uses: actions/checkout@v4
        with:
          repository: Dzammbo/jarvis-intuition
          token: ${{ secrets.JARVIS_PRIVATE_REPO_TOKEN }}
          path: state
      - name: Resolve settlement date
        id: request
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            D="${{ inputs.date_moscow }}"
          else
            D=$(grep -Eo '^[0-9]{4}-[0-9]{2}-[0-9]{2}' ops/triggers/run-final-card-check.txt | head -1)
          fi
          [[ "$D" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          echo "date=$D" >> "$GITHUB_OUTPUT"
      - name: Check final card
        working-directory: state
        run: python3 scripts/check_final_card_settlement.py --date-moscow "${{ steps.request.outputs.date }}"
      - name: Commit diagnostic to private state repository
        working-directory: state
        run: |
          set -euo pipefail
          git config user.name "jarvis-intuition-bot"
          git config user.email "jarvis-intuition-bot@users.noreply.github.com"
          git add diagnostics/check_only/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Check final card settlement"
          git pull --rebase origin main
          git push origin HEAD:main
