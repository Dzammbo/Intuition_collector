name: Bet365 strategy capability audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bet365-strategy-capability-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BETSAPI_TOKEN: ${{ secrets.BETS_API }}
    steps:
      - name: Probe prematch and live market coverage
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.parse, urllib.request
          BASE="https://api.b365api.com"
          TOKEN=os.environ["BETSAPI_TOKEN"]
          SPORTS={1:"football",13:"tennis",16:"baseball",17:"hockey",18:"basketball"}
          calls=0
          rate={}
          def get(path, params):
              global calls, rate
              q=dict(params); q["token"]=TOKEN
              url=BASE+path+"?"+urllib.parse.urlencode(q)
              with urllib.request.urlopen(url,timeout=40) as r:
                  calls+=1
                  rate={"limit":r.headers.get("X-RateLimit-Limit"),"remaining":r.headers.get("X-RateLimit-Remaining")}
                  return json.load(r)
          def walk(x):
              if isinstance(x,dict):
                  yield x
                  for v in x.values(): yield from walk(v)
              elif isinstance(x,list):
                  for v in x: yield from walk(v)
          def text(x):
              return json.dumps(x,ensure_ascii=False)
          def event_rows(p):
              out=[]; seen=set()
              for n in walk(p.get("results",p) if isinstance(p,dict) else p):
                  if not isinstance(n,dict): continue
                  fi=n.get("id") or n.get("FI") or n.get("r_id") or n.get("event_id")
                  if fi is None or str(fi) in seen: continue
                  if not (("home" in n and "away" in n) or "time_status" in n or "sport_id" in n or str(n.get("type","")).upper()=="EV"): continue
                  seen.add(str(fi))
                  out.append({"fi":str(fi),"raw":n})
              return out
          def summary(p):
              names=[]; selections=[]; records=[]
              current=""
              for n in walk(p.get("results",p) if isinstance(p,dict) else p):
                  if not isinstance(n,dict): continue
                  typ=str(n.get("type","")).upper()
                  name=str(n.get("NA") or n.get("name") or "")
                  if isinstance(n.get("odds"),list) and name:
                      current=name
                      if name not in names: names.append(name)
                      for o in n["odds"]:
                          if isinstance(o,dict):
                              selections.append({"market":name,"name":str(o.get("name") or ""),"line":o.get("handicap") or o.get("header"),"odds":o.get("odds")})
                  if typ in ("MA","MG"):
                      current=name
                      if name and name not in names: names.append(name)
                  elif typ=="PA":
                      line=n.get("HA") or n.get("HD") or n.get("line") or n.get("handicap")
                      selections.append({"market":current,"name":name,"line":line,"odds":n.get("OD")})
                  if any(k in n for k in ("stats","SS","scores","score","timer","TU","TM","TS")):
                      records.append({k:n.get(k) for k in ("type","NA","SS","scores","score","timer","TU","TM","TS") if k in n})
              blob=text(p)
              wanted=[s for s in selections if s["line"] is not None or re.search(r"total|under|over|set|period|quarter|inning|team",s["market"]+" "+s["name"],re.I)]
              return {
                "markets":names[:120],
                "priced":sum(bool(s["odds"]) for s in selections),
                "wanted":wanted[:120],
                "flags":{
                  "itf":bool(re.search(r"\bITF\b|M15|M25|W15|W25|W35|W50|W75|W100",blob,re.I)),
                  "match_sets":bool(re.search(r"total sets|sets total|2\.5 sets",blob,re.I)),
                  "game_totals":bool(re.search(r"total games|game lines|games over|games under",blob,re.I)),
                  "set_totals":bool(re.search(r"set.*total|total.*set",blob,re.I)),
                  "period_totals":bool(re.search(r"period.*total|total.*period",blob,re.I)),
                  "quarter_totals":bool(re.search(r"quarter.*total|total.*quarter",blob,re.I)),
                  "team_totals":bool(re.search(r"team total|home total|away total|individual total",blob,re.I)),
                  "innings":bool(re.search(r"inning",blob,re.I)),
                  "server":bool(re.search(r"server|serving|service",blob,re.I)),
                  "medical_timeout":bool(re.search(r"medical timeout|\bMTO\b",blob,re.I)),
                  "utr":bool(re.search(r"\bUTR\b|universal tennis rating",blob,re.I))
                },
                "state_records":records[:20]
              }
          report={"prematch":{},"live":{},"errors":[]}
          for sid,sname in SPORTS.items():
              try:
                  up=get("/v1/bet365/upcoming",{"sport_id":sid})
                  ev=event_rows(up)
                  if sname=="tennis":
                      ev=sorted(ev,key=lambda e:not bool(re.search(r"\bITF\b|M15|M25|W15|W25|W35|W50|W75|W100",text(e["raw"]),re.I)))
                  elif sname=="football":
                      ev=sorted(ev,key=lambda e:bool(re.search(r"esoccer|e-soccer|srl",text(e["raw"]),re.I)))
                  elif sname=="basketball":
                      ev=sorted(ev,key=lambda e:not bool(re.search(r"\bNBA\b",text(e["raw"]),re.I)))
                  report["prematch"][sname]={"upcoming_count":len(ev),"samples":[]}
                  for e in ev[:2 if sname=="tennis" else 1]:
                      try:
                          p=get("/v4/bet365/prematch",{"FI":e["fi"]})
                          report["prematch"][sname]["samples"].append({"fi":e["fi"],"event":e["raw"],"summary":summary(p)})
                      except Exception as ex:
                          report["errors"].append({"sport":sname,"stage":"prematch","fi":e["fi"],"error":str(ex)})
              except Exception as ex:
                  report["errors"].append({"sport":sname,"stage":"upcoming","error":str(ex)})
              try:
                  ip=get("/v1/bet365/inplay_filter",{"sport_id":sid})
                  ev=event_rows(ip)
                  report["live"][sname]={"live_count":len(ev),"samples":[]}
                  for e in ev[:1]:
                      try:
                          p=get("/v1/bet365/event",{"FI":e["fi"]})
                          report["live"][sname]["samples"].append({"fi":e["fi"],"event":e["raw"],"summary":summary(p)})
                      except Exception as ex:
                          report["errors"].append({"sport":sname,"stage":"live_event","fi":e["fi"],"error":str(ex)})
              except Exception as ex:
                  report["errors"].append({"sport":sname,"stage":"inplay","error":str(ex)})
          report["calls"]=calls; report["rate_limit"]=rate
          with open("bet365-strategy-capability-audit.json","w",encoding="utf-8") as f:
              json.dump(report,f,ensure_ascii=False,indent=2)
          print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bet365-strategy-capability-audit
          path: bet365-strategy-capability-audit.json
          if-no-files-found: error
          retention-days: 3
