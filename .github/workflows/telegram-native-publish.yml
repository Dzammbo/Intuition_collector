name: Native Telegram Publish

on:
  workflow_dispatch:
    inputs:
      report:
        description: Path inside private state repository
        required: true
        type: string
      kind:
        description: PREMATCH, MIDDAY, FINAL, RESULTS, or COMPACT
        required: true
        type: choice
        options: [PREMATCH, MIDDAY, FINAL, RESULTS, COMPACT]
      date:
        description: YYYY-MM-DD
        required: true
        type: string
      logical_suffix:
        description: Optional same-day card key suffix
        required: false
        type: string
      absorb_marker:
        description: Optional prior Telegram publication marker to absorb
        required: false
        type: string
  push:
    branches: [main]
    paths: [triggers/run-telegram-publish.txt]

permissions:
  contents: read

concurrency:
  group: public-native-telegram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRIVATE_REPO_TOKEN: ${{ secrets.JARVIS_PRIVATE_REPO_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Verify required secrets
        run: |
          set -euo pipefail
          test -n "${PRIVATE_REPO_TOKEN:-}" || { echo "JARVIS_PRIVATE_REPO_TOKEN secret is missing"; exit 1; }
          test -n "${TELEGRAM_BOT_TOKEN:-}" || { echo "TELEGRAM_BOT_TOKEN secret is missing"; exit 1; }
          test -n "${TELEGRAM_CHAT_ID:-}" || { echo "TELEGRAM_CHAT_ID secret is missing"; exit 1; }
      - uses: actions/checkout@v4
        with:
          path: ops
      - uses: actions/checkout@v4
        with:
          repository: Dzammbo/jarvis-intuition
          token: ${{ secrets.JARVIS_PRIVATE_REPO_TOKEN }}
          path: state
      - name: Resolve explicit publication request
        id: request
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REPORT="${{ inputs.report }}"
            KIND="${{ inputs.kind }}"
            DATE="${{ inputs.date }}"
            LOGICAL_SUFFIX="${{ inputs.logical_suffix }}"
            ABSORB_MARKER="${{ inputs.absorb_marker }}"
          else
            REPORT=$(sed -n '1p' ops/triggers/run-telegram-publish.txt)
            KIND=$(sed -n '2p' ops/triggers/run-telegram-publish.txt)
            DATE=$(sed -n '3p' ops/triggers/run-telegram-publish.txt)
            LOGICAL_SUFFIX=$(sed -n '4p' ops/triggers/run-telegram-publish.txt)
            ABSORB_MARKER=$(sed -n 's/^absorb_marker=//p' ops/triggers/run-telegram-publish.txt | head -1)
          fi
          [[ "$REPORT" != /* && "$REPORT" != *".."* ]]
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          case "$KIND" in PREMATCH|MIDDAY|FINAL|RESULTS|COMPACT) ;; *) echo "Unsupported kind: $KIND"; exit 2;; esac
          test -f "state/$REPORT"
          echo "report=$REPORT" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          [[ -z "$LOGICAL_SUFFIX" || "$LOGICAL_SUFFIX" =~ ^[a-z0-9-]+$ ]]
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "logical_suffix=$LOGICAL_SUFFIX" >> "$GITHUB_OUTPUT"
          [[ -z "$ABSORB_MARKER" || ( "$ABSORB_MARKER" != /* && "$ABSORB_MARKER" != *".."* ) ]]
          echo "absorb_marker=$ABSORB_MARKER" >> "$GITHUB_OUTPUT"
      - name: Enforce price-independent deep-research decisions
        run: python3 ops/validate_holistic_decision_contract.py state
      - name: Publish explicitly requested report
        working-directory: state
        run: |
          set -euo pipefail
          ABSORB_ARGS=()
          if [ -n "${{ steps.request.outputs.absorb_marker }}" ]; then
            ABSORB_ARGS=(--absorb-marker "${{ steps.request.outputs.absorb_marker }}")
          fi
          python3 scripts/publish_telegram.py \
            --report "${{ steps.request.outputs.report }}" \
            --kind "${{ steps.request.outputs.kind }}" \
            --date "${{ steps.request.outputs.date }}" \
            --logical-suffix "${{ steps.request.outputs.logical_suffix }}" \
            "${ABSORB_ARGS[@]}"
      - name: Commit publication markers to private repository
        working-directory: state
        run: |
          set -euo pipefail
          git config user.name "jarvis-intuition-bot"
          git config user.email "jarvis-intuition-bot@users.noreply.github.com"
          git add telegram_publications/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Telegram publication"
          git pull --rebase origin main
          git push origin HEAD:main
