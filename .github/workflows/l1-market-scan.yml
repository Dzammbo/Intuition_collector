name: L1 Broad Signal Market Scan

on:
  push:
    branches: [main]
    paths: ['triggers/run-enrichment-2026-09-28.txt']
  workflow_dispatch:
    inputs:
      source_run_id:
        description: GitHub Actions run id containing the final classified Universe artifact
        required: true
        type: string
      date_moscow:
        description: Canonical Moscow day in YYYY-MM-DD format
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BETSAPI_TOKEN: ${{ secrets.BETS_API }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate explicit inputs
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then SRC=$(sed -n "1p" triggers/run-enrichment-2026-09-28.txt); DAY=$(sed -n "2p" triggers/run-enrichment-2026-09-28.txt); else SRC="${{ inputs.source_run_id }}"; DAY="${{ env.DAY }}"; fi
          [[ "$SRC" =~ ^[0-9]+$ ]]
          [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          echo "SRC=$SRC" >> "$GITHUB_ENV"
          echo "DAY=$DAY" >> "$GITHUB_ENV"
      - name: Download classified Universe artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SRC }}
          pattern: '*universe*'
          merge-multiple: true
      - name: Verify classified snapshot
        run: |
          set -euo pipefail
          test -f classified-universe.json
          python3 - <<'PY'
          import json
          d = json.load(open("classified-universe.json"))
          assert d.get("window_event_count", 0) > 0
          events = d.get("events", {})
          assert isinstance(events.get("CORE"), list)
          assert isinstance(events.get("SECONDARY"), list)
          assert isinstance(events.get("EXCLUDE"), list)
          classified = sum(len(events.get(k, [])) for k in ("CORE", "SECONDARY", "EXCLUDE"))
          assert classified == d["window_event_count"]
          print({"window": d["window_event_count"], "core": len(events["CORE"])})
          PY
      - name: Run L1 market scan
        run: python3 l1_market_scan.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l1-market-scan-${{ env.DAY }}
          path: l1-market-raw.json
          if-no-files-found: error
          retention-days: 7
