name: L1 Tennis Singles Market Scan

on:
  push:
    branches: [main]
    paths: ['triggers/run-enrichment-2026-09-28.txt']
  workflow_dispatch:
    inputs:
      source_run_id:
        description: GitHub Actions run id containing the classified tennis universe
        required: true
        type: string
      date_moscow:
        description: Canonical Moscow day in YYYY-MM-DD format
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BETSAPI_TOKEN: ${{ secrets.BETS_API }}
      GH_TOKEN: ${{ github.token }}
      BETSAPI_HTTP_WORKERS: "8"
    steps:
      - uses: actions/checkout@v4
      - name: Validate explicit inputs
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            SRC=$(sed -n "1p" triggers/run-enrichment-2026-09-28.txt)
            DAY=$(sed -n "2p" triggers/run-enrichment-2026-09-28.txt)
          else
            SRC="${{ inputs.source_run_id }}"
            DAY="${{ inputs.date_moscow }}"
          fi
          [[ "$SRC" =~ ^[0-9]+$ ]]
          [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          echo "SRC=$SRC" >> "$GITHUB_ENV"
          echo "DAY=$DAY" >> "$GITHUB_ENV"
      - name: Download classified tennis universe
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SRC }}
          pattern: '*universe*'
          merge-multiple: true
      - name: Verify singles scope
        run: |
          set -euo pipefail
          test -f classified-universe.json
          python3 - <<'PY'
          import json
          d = json.load(open("classified-universe.json"))
          assert d.get("stage") == "TENNIS_SINGLES_SCOPE_CLASSIFICATION"
          assert d.get("tiering_used") is False
          events = d.get("events", {})
          keys = ("TENNIS_SINGLES", "EXCLUDED_DOUBLES", "EXCLUDED_NON_TENNIS", "TECHNICAL_EXCLUSION")
          for key in keys:
              assert isinstance(events.get(key), list)
          classified = sum(len(events[key]) for key in keys)
          assert classified == d["window_event_count"]
          assert classified == d["raw_window_event_count"]
          print({"window": classified, "singles": len(events["TENNIS_SINGLES"]), "doubles": len(events["EXCLUDED_DOUBLES"]), "technical": len(events["TECHNICAL_EXCLUSION"])})
          PY
      - name: Scan every eligible singles event
        run: python3 l1_market_scan.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l1-market-scan-${{ env.DAY }}
          path: l1-market-raw.json
          if-no-files-found: error
          retention-days: 7
