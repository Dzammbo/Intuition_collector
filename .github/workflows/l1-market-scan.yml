name: L1 Broad Signal Market Scan
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BETSAPI_TOKEN: ${{ secrets.BETS_API }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download classified Universe artifact
        uses: actions/download-artifact@v4
        with:
          name: universe
          github-token: ${{ github.token }}
          run-id: 36312014705
      - name: Verify classified snapshot
        run: |
          test -f classified-universe.json
          python3 - <<'PY'
          import json
          d=json.load(open("classified-universe.json"))
          assert d["window_event_count"]==1475
          assert len(d["events"]["CORE"])==582
          print({"window":d["window_event_count"],"core":len(d["events"]["CORE"])})
          PY
      - name: Run L1 market scan
        run: python3 l1_market_scan.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l1-market-scan-2026-09-27
          path: l1-market-raw.json
          retention-days: 7
