name: Assessment Current Price Refresh

on:
  push:
    branches: [main]
    paths: ['triggers/run-assessment-price-refresh.json']

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BETSAPI_TOKEN: ${{ secrets.BETS_API }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Dzammbo/jarvis-intuition
          token: ${{ secrets.JARVIS_PRIVATE_REPO_TOKEN }}
          path: state
      - name: Verify canonical assessment candidate index
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          trigger=json.loads(Path("triggers/run-assessment-price-refresh.json").read_text())
          day=trigger["date_moscow"]
          index=json.loads((Path("state")/f"assessment_inputs/{day}/assessment-candidate-index.json").read_text())
          candidates={str(row["event_id"]) for row in index["candidates"]}
          requested={str(event_id) for event_id in trigger["event_ids"]}
          missing=sorted(requested-candidates)
          if missing:
              raise SystemExit(f"requested events absent from canonical candidate index: {missing}")
          print({"candidate_count": index["count"], "requested": len(requested)})
          PY
      - name: Validate trigger
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open("triggers/run-assessment-price-refresh.json"))
          assert d["date_moscow"]
          assert isinstance(d["batch"], int)
          assert 1 <= len(d["event_ids"]) <= 50
          assert len(d["event_ids"]) == len(set(map(str,d["event_ids"])))
          PY
      - name: Refresh exact event markets
        run: python3 assessment_price_refresh.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assessment-price-refresh-${{ github.run_id }}
          path: assessment-price-refresh.json
          if-no-files-found: error
          retention-days: 7
