name: Assessment Current Price Refresh

on:
  push:
    branches: [main]
    paths: ['triggers/run-assessment-price-refresh.json']

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BETSAPI_TOKEN: ${{ secrets.BETS_API }}
      BETSAPI_HTTP_WORKERS: "8"
      PRICE_REVEAL_REQUEST: price-reveal-worklist.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Dzammbo/jarvis-intuition
          token: ${{ secrets.JARVIS_PRIVATE_REPO_TOKEN }}
          path: state

      - name: Build and validate canonical price-reveal worklist
        run: |
          python3 - <<'PY'
          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          trigger = json.loads(Path("triggers/run-assessment-price-refresh.json").read_text())
          day = trigger["date_moscow"]
          card_key = trigger.get("card_key") or day
          if not re.fullmatch(r"[A-Za-z0-9._-]+", card_key):
              raise SystemExit("card_key contains unsupported characters")
          manifest_ref = trigger.get("sporting_freeze_manifest_ref") or f"price_blind_assessments/{day}-repair/manifest.json"
          manifest_path = Path("state") / manifest_ref
          manifest = json.loads(manifest_path.read_text())
          supported = {}
          for row in manifest["assessments"]:
              is_holistic = manifest.get("contract_version") == "2026-10-09-holistic-deep-research-v1"
              if is_holistic:
                  if row.get("research_decision") not in {"BET", "PASS"}:
                      continue
                  normalized = dict(row)
                  normalized["supported_side"] = row["selected_side"]
              else:
                  if row.get("sporting_verdict") != "SIDE_SUPPORTED":
                      continue
                  normalized = row
              supported[str(row["event_id"])] = normalized

          requested = trigger.get("events") or []
          if requested:
              candidates = requested
          else:
              compact_dir_ref = trigger.get("compact_batch_dir") or f"price_blind_inputs/{day}/compact-batches"
              starts = {}
              for path in sorted((Path("state") / compact_dir_ref).glob("batch-*.json")):
                  payload = json.loads(path.read_text())
                  for event in payload.get("events") or []:
                      starts[str(event["event_id"])] = event["scheduled_start_utc"]
              candidates = []
              for event_id, frozen in supported.items():
                  if event_id not in starts:
                      raise SystemExit(f"scheduled start absent for supported event: {event_id}")
                  candidates.append({
                      "event_id": event_id,
                      "supported_side": frozen["supported_side"],
                      "scheduled_start_utc": starts[event_id],
                      "assessment_ref": frozen["assessment_ref"],
                      "assessment_sha256": frozen["assessment_sha256"],
                  })

          now = datetime.now(timezone.utc)
          queryable = []
          started = []
          seen = set()
          for event in candidates:
              event_id = str(event["event_id"])
              if event_id in seen:
                  raise SystemExit(f"duplicate event: {event_id}")
              seen.add(event_id)
              if event_id not in supported:
                  raise SystemExit(f"event absent from supported sporting freeze: {event_id}")
              frozen = supported[event_id]
              for key in ("supported_side", "assessment_ref", "assessment_sha256"):
                  if event[key] != frozen[key]:
                      raise SystemExit(f"freeze mismatch for {event_id}: {key}")
              start = datetime.fromisoformat(event["scheduled_start_utc"].replace("Z", "+00:00"))
              if now >= start:
                  started.append({
                      "event_id": event_id,
                      "checked_at": now.isoformat().replace("+00:00", "Z"),
                      "reason": "STARTED_BEFORE_PRICE_WORKLIST_BUILD",
                  })
              else:
                  queryable.append(event)

          queryable.sort(key=lambda row: (row["scheduled_start_utc"], str(row["event_id"])))
          if not queryable:
              raise SystemExit("no supported events remain prematch")
          worklist = {
              **trigger,
              "card_key": card_key,
              "sporting_freeze_manifest_ref": manifest_ref,
              "worklist_built_at": now.isoformat().replace("+00:00", "Z"),
              "events": queryable,
              "prefiltered_started": started,
          }
          Path("price-reveal-worklist.json").write_text(
              json.dumps(worklist, ensure_ascii=False, indent=2) + "\n"
          )
          print({
              "supported_count": len(supported),
              "queryable": len(queryable),
              "already_started": len(started),
              "manifest_ref": manifest_ref,
          })
          PY

      - name: Capture exact event markets
        run: python3 assessment_price_refresh.py

      - name: Persist raw capture in canonical repository
        run: |
          DAY=$(python3 -c 'import json; print(json.load(open("price-reveal-worklist.json"))["date_moscow"])')
          CARD_KEY=$(python3 -c 'import json; print(json.load(open("price-reveal-worklist.json"))["card_key"])')
          BATCH=$(python3 -c 'import json; print(json.load(open("price-reveal-worklist.json")).get("batch", 1))')
          mkdir -p "state/price_reveals/$CARD_KEY/raw"
          cp assessment-price-refresh.json "state/price_reveals/$CARD_KEY/raw/price-reveal-batch-$BATCH.json"
          cd state
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "price_reveals/$CARD_KEY/raw/price-reveal-batch-$BATCH.json"
          git commit -m "price reveal: persist raw batch $BATCH for $CARD_KEY"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assessment-price-refresh-${{ github.run_id }}
          path: |
            assessment-price-refresh.json
            price-reveal-worklist.json
          if-no-files-found: error
          retention-days: 7
