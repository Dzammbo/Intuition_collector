name: Assessment Current Price Refresh

on:
  push:
    branches: [main]
    paths: ['triggers/run-assessment-price-refresh.json']

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BETSAPI_TOKEN: ${{ secrets.BETS_API }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Dzammbo/jarvis-intuition
          token: ${{ secrets.JARVIS_PRIVATE_REPO_TOKEN }}
          path: state
      - name: Export compact active candidate index
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("state"); day=json.loads(Path("triggers/run-assessment-price-refresh.json").read_text())["date_moscow"]
          ledger=json.loads((root/f"candidate_screen_outputs/{day}/model-pre-screen-ledger-v2-tennis-full-coverage.json").read_text())
          packet=json.loads((root/f"candidate_screen_inputs/{day}/model-prescreen-packet.json").read_text())
          rows=next(v for v in ledger.values() if isinstance(v,list) and len(v)==395)
          advanced=[]
          for r in rows:
              status=str(r.get("research_candidate_status") or r.get("status") or r.get("decision") or "").upper()
              if status in {"RESEARCH_CANDIDATE","ADVANCE","ADVANCED"} or r.get("advanced") is True:
                  advanced.append(str(r.get("event_id") or r.get("id")))
          if len(advanced)!=231: raise SystemExit(f"expected 231 candidates, got {len(advanced)}")
          cards={str(c["event_id"]):c for c in packet["cards"]}; out=[]
          for i,eid in enumerate(advanced,1):
              c=cards[eid]; out.append({"candidate_index":i,"ordinal":c.get("ordinal"),"event_id":eid,"source_tier":c.get("source_tier"),"sport_id":str(c.get("sport_id")),"league":c.get("league"),"home":c.get("home"),"away":c.get("away"),"start_time":c.get("start_time")})
          dest=root/f"assessment_inputs/{day}/assessment-candidate-index.json"; dest.parent.mkdir(parents=True,exist_ok=True); dest.write_text(json.dumps({"schema_version":1,"date_moscow":day,"count":len(out),"candidates":out},ensure_ascii=False,indent=2)+"\\n")
          PY
          cd state
          git config user.name "jarvis-intuition-bot"
          git config user.email "jarvis-intuition-bot@users.noreply.github.com"
          git add assessment_inputs/
          if ! git diff --cached --quiet; then
            git commit -m "Export compact assessment candidate index"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Validate trigger
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open("triggers/run-assessment-price-refresh.json"))
          assert d["date_moscow"]
          assert isinstance(d["batch"], int)
          assert 1 <= len(d["event_ids"]) <= 50
          assert len(d["event_ids"]) == len(set(map(str,d["event_ids"])))
          PY
      - name: Refresh exact event markets
        run: python3 assessment_price_refresh.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assessment-price-refresh-${{ github.run_id }}
          path: assessment-price-refresh.json
          if-no-files-found: error
          retention-days: 7
