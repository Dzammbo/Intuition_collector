name: Build Tennis Singles Research Packet
on:
  workflow_dispatch:
    inputs:
      odds_run_id: {description: Odds workflow run id, required: true, type: string}
      event_view_run_id: {description: Event View workflow run id, required: true, type: string}
      date_moscow: {description: YYYY-MM-DD, required: true, type: string}
  push:
    branches: [main]
    paths: ['triggers/run-model-packet.txt']
permissions:
  contents: read
  actions: read
concurrency:
  group: persist-tennis-singles-research-packet
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve inputs
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "ODDS=$(sed -n '1p' triggers/run-model-packet.txt)" >> "$GITHUB_ENV"
            echo "VIEW=$(sed -n '2p' triggers/run-model-packet.txt)" >> "$GITHUB_ENV"
            echo "DAY=$(sed -n '3p' triggers/run-model-packet.txt)" >> "$GITHUB_ENV"
          else
            echo "ODDS=${{ inputs.odds_run_id }}" >> "$GITHUB_ENV"
            echo "VIEW=${{ inputs.event_view_run_id }}" >> "$GITHUB_ENV"
            echo "DAY=${{ inputs.date_moscow }}" >> "$GITHUB_ENV"
          fi
      - uses: actions/download-artifact@v4
        with:
          name: l1-market-scan-${{ env.DAY }}
          github-token: ${{ github.token }}
          run-id: ${{ env.ODDS }}
          path: odds
      - uses: actions/download-artifact@v4
        with:
          name: event-view-singles-${{ env.DAY }}
          github-token: ${{ github.token }}
          run-id: ${{ env.VIEW }}
          path: view
      - name: Build lossless singles packet
        run: python3 build_model_prescreen_packet.py odds/l1-market-raw.json view/event-view-singles.json
      - uses: actions/checkout@v4
        with:
          repository: Dzammbo/jarvis-intuition
          token: ${{ secrets.JARVIS_PRIVATE_REPO_TOKEN }}
          path: state
      - name: Verify every eligible single advances
        run: |
          python3 - <<'PY'
          import json
          packet = json.load(open("model-prescreen-packet.json", encoding="utf-8"))
          assert packet["stage"] == "TENNIS_SINGLES_RESEARCH_PACKET"
          assert packet["handoff_status"] == "READY_FOR_ASSESSMENT"
          assert packet["substantive_prescreen_required"] is False
          assert packet["tiering_used"] is False
          assert len(packet["cards"]) == packet["input"]
          assert all(c.get("scope_status") == "TENNIS_SINGLES" for c in packet["cards"])
          assert all(c.get("price_gate_status") in {"PRICE_READY", "WAITING_FOR_PRICE"} for c in packet["cards"])
          assert packet["source_accounting"]["price_ready"] + packet["source_accounting"]["waiting_for_price"] == packet["input"]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tennis-singles-research-packet-${{ env.DAY }}
          path: model-prescreen-packet.json
          retention-days: 7

      - name: Build complete assessment index
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path("state")
          day = os.environ["DAY"]
          packet = json.loads(Path("model-prescreen-packet.json").read_text())
          out = []
          for i, c in enumerate(packet["cards"], 1):
              out.append({
                  "candidate_index": i,
                  "ordinal": c.get("ordinal"),
                  "event_id": str(c["event_id"]),
                  "scope_status": "TENNIS_SINGLES",
                  "price_gate_status": c.get("price_gate_status"),
                  "sport_id": "13",
                  "league": c.get("league"),
                  "home": c.get("home"),
                  "away": c.get("away"),
                  "start_time": c.get("start_time"),
                  "player_refs": c.get("player_refs") or [],
              })
          dest = root / f"assessment_inputs/{day}/assessment-candidate-index.json"
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_text(json.dumps({
              "schema_version": 2,
              "date_moscow": day,
              "scope": "ALL_REAL_TENNIS_SINGLES",
              "tiering_used": False,
              "count": len(out),
              "candidates": out,
          }, ensure_ascii=False, indent=2) + "\n")
          PY

      - name: Persist singles packet to canonical state
        run: |
          set -euo pipefail
          mkdir -p "state/candidate_screen_inputs/$DAY"
          cp model-prescreen-packet.json "state/candidate_screen_inputs/$DAY/tennis-singles-research-packet.json"
          cd state
          git config user.name "Jarvis Intuition Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "candidate_screen_inputs/$DAY/tennis-singles-research-packet.json" "assessment_inputs/$DAY/assessment-candidate-index.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist $DAY tennis singles research packet"
          git pull --rebase origin main
          git push origin HEAD:main
