name: Export Jarvis Assessment Index

on:
  push:
    paths: ['triggers/run-export-assessment-index.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Dzammbo/jarvis-intuition
          token: ${{ secrets.JARVIS_PRIVATE_REPO_TOKEN }}
          path: jarvis
      - name: Build compact candidate index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter

          trigger=json.loads(Path('triggers/run-export-assessment-index.json').read_text())
          day=trigger['date_moscow']
          root=Path('jarvis')
          ledger=json.loads((root/f'candidate_screen_outputs/{day}/model-pre-screen-ledger-v2-tennis-full-coverage.json').read_text())
          packet=json.loads((root/f'candidate_screen_inputs/{day}/model-prescreen-packet.json').read_text())
          rows=next(v for k,v in ledger.items() if k in ('decisions','records','entries','ledger') and isinstance(v,list))

          advanced=[]
          for row in rows:
              status=str(row.get('research_candidate_status') or row.get('status') or row.get('decision') or row.get('outcome') or '').upper()
              if status in {'RESEARCH_CANDIDATE','ADVANCE','ADVANCED','RESEARCH','KEEP','INCLUDE'} or row.get('advanced') is True:
                  eid=str(row.get('event_id') or row.get('id') or '')
                  if eid: advanced.append(eid)
          if len(advanced)!=231:
              raise SystemExit(f'Expected 231 advanced rows, got {len(advanced)}; statuses={Counter(str(r.get("research_candidate_status") or r.get("status") or "") for r in rows)}')

          card_map={str(c.get('event_id')):c for c in packet['cards']}
          out=[]
          for i,eid in enumerate(advanced,1):
              c=card_map[eid]
              out.append({'candidate_index':i,'ordinal':c.get('ordinal'),'event_id':eid,'source_tier':c.get('source_tier'),'sport_id':str(c.get('sport_id')),'league':c.get('league'),'home':c.get('home'),'away':c.get('away'),'start_time':c.get('start_time')})
          dest=Path(f'exports/{day}/assessment-candidate-index.json')
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_text(json.dumps({'schema_version':1,'date_moscow':day,'count':len(out),'candidates':out},ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit index export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/
          git diff --cached --quiet && exit 0
          git commit -m "Export compact assessment candidate index"
          git push
