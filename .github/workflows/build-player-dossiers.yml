name: Build Baseline Tennis Player Dossiers

on:
  workflow_dispatch:
    inputs:
      universe_run_id:
        description: GitHub Actions run id containing the classified tennis universe
        required: true
        type: string
      event_view_run_id:
        description: GitHub Actions run id containing Event View for the same universe
        required: true
        type: string
      date_moscow:
        description: Canonical Moscow card date in YYYY-MM-DD format
        required: true
        type: string
      diagnostic_match_limit:
        description: Optional earliest-start subset for a non-persistent smoke test
        required: false
        type: string
  push:
    branches: [main]
    paths: ['triggers/run-player-dossiers.txt']

permissions:
  contents: read
  actions: read

concurrency:
  group: persist-tennis-player-dossiers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BETSAPI_TOKEN: ${{ secrets.BETS_API }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve explicit inputs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            UNIVERSE_RUN="$(sed -n '1p' triggers/run-player-dossiers.txt)"
            EVENT_VIEW_RUN="$(sed -n '2p' triggers/run-player-dossiers.txt)"
            DAY="$(sed -n '3p' triggers/run-player-dossiers.txt)"
            DIAGNOSTIC_LIMIT="$(sed -n '4p' triggers/run-player-dossiers.txt)"
          else
            UNIVERSE_RUN="${{ inputs.universe_run_id }}"
            EVENT_VIEW_RUN="${{ inputs.event_view_run_id }}"
            DAY="${{ inputs.date_moscow }}"
            DIAGNOSTIC_LIMIT="${{ inputs.diagnostic_match_limit }}"
          fi
          [[ "$UNIVERSE_RUN" =~ ^[0-9]+$ ]]
          [[ "$EVENT_VIEW_RUN" =~ ^[0-9]+$ ]]
          [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$DIAGNOSTIC_LIMIT" =~ ^$|^[1-9][0-9]*$ ]]
          echo "UNIVERSE_RUN=$UNIVERSE_RUN" >> "$GITHUB_ENV"
          echo "EVENT_VIEW_RUN=$EVENT_VIEW_RUN" >> "$GITHUB_ENV"
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          echo "DIAGNOSTIC_LIMIT=$DIAGNOSTIC_LIMIT" >> "$GITHUB_ENV"

      - name: Download classified tennis universe
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.UNIVERSE_RUN }}
          name: universe
          path: universe

      - name: Download Event View for the same card
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.EVENT_VIEW_RUN }}
          pattern: event-view-singles-*
          merge-multiple: true
          path: event-view

      - uses: actions/checkout@v4
        with:
          repository: Dzammbo/jarvis-intuition
          token: ${{ secrets.JARVIS_PRIVATE_REPO_TOKEN }}
          path: state

      - name: Select earliest-start diagnostic subset
        if: env.DIAGNOSTIC_LIMIT != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          limit = int(os.environ["DIAGNOSTIC_LIMIT"])
          universe_path = Path("universe/classified-universe.json")
          event_view_path = Path("event-view/event-view-singles.json")
          universe = json.loads(universe_path.read_text())
          event_view = json.loads(event_view_path.read_text())
          singles = sorted(
              universe.get("events", {}).get("TENNIS_SINGLES") or [],
              key=lambda row: (int(row.get("time") or 0), str(row.get("id") or "")),
          )
          if len(singles) < limit:
              raise SystemExit(f"diagnostic limit {limit} exceeds eligible singles {len(singles)}")
          selected = singles[:limit]
          selected_ids = {str(row.get("id") or "") for row in selected}
          records = [
              row for row in event_view.get("records") or []
              if str(row.get("id") or "") in selected_ids
          ]
          if len(records) != limit or {str(row.get("id") or "") for row in records} != selected_ids:
              raise SystemExit("Event View does not cover diagnostic subset one-to-one")
          universe["events"]["TENNIS_SINGLES"] = selected
          universe["diagnostic_subset"] = {
              "mode": "EARLIEST_START_NON_PERSISTENT_SMOKE_TEST",
              "limit": limit,
              "source_eligible_singles": len(singles),
          }
          event_view["records"] = records
          event_view["input_singles"] = limit
          event_view["input_total"] = limit
          event_view["completed"] = limit
          event_view["successful"] = sum(not row.get("technical_error") for row in records)
          event_view["errors"] = [
              row for row in event_view.get("errors") or []
              if str(row.get("ids") or "") in selected_ids
          ]
          event_view["diagnostic_subset"] = universe["diagnostic_subset"]
          universe_path.write_text(json.dumps(universe, ensure_ascii=False), encoding="utf-8")
          event_view_path.write_text(json.dumps(event_view, ensure_ascii=False), encoding="utf-8")
          print(json.dumps({
              "diagnostic_matches": limit,
              "first_event": selected[0]["id"],
              "last_event": selected[-1]["id"],
          }))
          PY

      - name: Validate complete one-to-one inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f universe/classified-universe.json
          test -f event-view/event-view-singles.json
          python3 - <<'PY'
          import json
          u = json.load(open("universe/classified-universe.json"))
          e = json.load(open("event-view/event-view-singles.json"))
          singles = u.get("events", {}).get("TENNIS_SINGLES")
          assert isinstance(singles, list) and singles
          assert u.get("stage") == "TENNIS_SINGLES_SCOPE_CLASSIFICATION"
          assert u.get("tiering_used") is False
          assert e.get("stage") == "TENNIS_SINGLES_EVENT_VIEW"
          assert e.get("input_singles") == len(singles)
          assert e.get("completed") == len(singles)
          ids = [str(row.get("id") or "") for row in e.get("records") or []]
          assert len(ids) == len(set(ids)) == len(singles)
          assert set(ids) == {str(row.get("id") or "") for row in singles}
          PY

      - name: Download open historical match archive
        shell: bash
        run: |
          set -euo pipefail
          for year in 2024 2025 2026; do
            curl --fail --location --retry 3 --silent --show-error \
              "https://www.valuebetennis.com/datasets/valuebetennis-matchs-${year}.csv" \
              --output "valuebetennis-matchs-${year}.csv"
          done

      - name: Capture all pages of provider singles rankings
        shell: bash
        run: |
          set -euo pipefail
          RANKING_ARGS=()
          if [ -n "$DIAGNOSTIC_LIMIT" ]; then
            RANKING_ARGS=(--allow-provider-single-page)
          fi
          python3 collect_tennis_rankings.py --output-dir rankings "${RANKING_ARGS[@]}"
          python3 - <<'PY'
          import json
          import os
          m = json.load(open("rankings/manifest.json"))
          assert m.get("provider_responses_complete") is True
          if not os.environ.get("DIAGNOSTIC_LIMIT"):
              assert m.get("full_ranking_coverage") is True
          assert {row["type_id"] for row in m["types"]} == {1, 3}
          PY

      - name: Build separated baseline dossier layers
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS_ARGS=()
          if [ -f state/player_dossiers/player-history.json ]; then
            PREVIOUS_ARGS=(--previous-player-history state/player_dossiers/player-history.json)
          fi
          python3 build_player_dossiers.py \
            --universe universe/classified-universe.json \
            --event-view event-view/event-view-singles.json \
            --matches valuebetennis-matchs-2024.csv valuebetennis-matchs-2025.csv valuebetennis-matchs-2026.csv \
            --materialized-at-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --ranking-snapshots rankings/betsapi-ranking-1.json rankings/betsapi-ranking-3.json \
            --history-output player-history.json \
            --snapshot-output baseline-history-snapshot.json \
            --match-context-output match-context-snapshots.json \
            --manifest-output baseline-dossier-manifest.json \
            "${PREVIOUS_ARGS[@]}"

      - name: Validate baseline dossier contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          h = json.load(open("player-history.json"))
          s = json.load(open("baseline-history-snapshot.json"))
          c = json.load(open("match-context-snapshots.json"))
          m = json.load(open("baseline-dossier-manifest.json"))
          assert h["stage"] == "BASELINE_PLAYER_HISTORY_REGISTRY"
          assert s["stage"] == "BASELINE_PLAYER_HISTORY_SNAPSHOT"
          assert c["stage"] == "MATCH_SPECIFIC_DOSSIER_CONTEXT"
          assert m["classification"] == "BASELINE_DOSSIER_NOT_FULL_MULTI_SOURCE"
          assert m["coverage"]["eligible_matches"] == m["coverage"]["match_contexts"]
          assert m["coverage"]["ranking_provider_responses_complete"] is True
          if not os.environ.get("DIAGNOSTIC_LIMIT"):
              assert m["coverage"]["ranking_full_coverage"] is True
          forbidden = {"ss", "points", "stats", "events", "scores", "time_status"}
          assert all(not (forbidden & set(row)) for row in c["events"])
          PY

      - name: Persist baseline dossier layers to canonical state
        if: env.DIAGNOSTIC_LIMIT == ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "state/player_dossiers/$DAY"
          cp player-history.json state/player_dossiers/player-history.json
          cp baseline-history-snapshot.json "state/player_dossiers/$DAY/baseline-history-snapshot.json"
          cp match-context-snapshots.json "state/player_dossiers/$DAY/match-context-snapshots.json"
          cp baseline-dossier-manifest.json "state/player_dossiers/$DAY/baseline-dossier-manifest.json"
          cd state
          git config user.name "Jarvis Intuition Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            player_dossiers/player-history.json \
            "player_dossiers/$DAY/baseline-history-snapshot.json" \
            "player_dossiers/$DAY/match-context-snapshots.json" \
            "player_dossiers/$DAY/baseline-dossier-manifest.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist $DAY baseline player dossier layers"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: baseline-tennis-player-dossiers-${{ env.DAY }}-run-${{ github.run_id }}
          path: |
            player-history.json
            baseline-history-snapshot.json
            match-context-snapshots.json
            baseline-dossier-manifest.json
            rankings/manifest.json
          retention-days: 7
