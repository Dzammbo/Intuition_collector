name: Capture Bet365 Closing Line (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: capture-bet365-closing
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      BETSAPI_TOKEN: ${{ secrets.BETS_API }}
      STATE_ROOT: state
    steps:
      - uses: actions/checkout@v4
        with:
          path: ops
      - uses: actions/checkout@v4
        with:
          repository: Dzammbo/jarvis-intuition
          token: ${{ secrets.JARVIS_PRIVATE_REPO_TOKEN }}
          path: state
      - name: Validate collector functions
        working-directory: ops
        run: python3 -m unittest -v test_capture_bet365_closing.py
      - name: Monitor and commit closing snapshots every five minutes
        id: monitor
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 20400 ))
          remaining=1
          while [ "$(date +%s)" -lt "$deadline" ]; do
            python3 ops/capture_bet365_closing.py
            remaining=$(python3 -c 'import json; print(json.load(open("state/diagnostics/bet365_closing/latest.json"))["targets_open"])')
            captured=$(python3 -c 'import json; print(json.load(open("state/diagnostics/bet365_closing/latest.json"))["snapshots_created"])')
            closed=$(python3 -c 'import json; print(json.load(open("state/diagnostics/bet365_closing/latest.json"))["targets_closed"])')
            (
              cd state
              git config user.name "jarvis-intuition-bot"
              git config user.email "jarvis-intuition-bot@users.noreply.github.com"
              git add diagnostics/bet365_closing/
              if [ -d closing_line_snapshots ]; then git add closing_line_snapshots/; fi
              if [ "$captured" -eq 0 ] && [ "$closed" -eq 0 ] && [ "$remaining" -ne 0 ] && [ "$(git rev-list --count origin/main..HEAD)" -eq 0 ]; then
                git reset
              elif ! git diff --cached --quiet; then
                git commit -m "Capture Bet365 closing-line snapshots"
              fi
              if [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]; then
                pushed=0
                for attempt in 1 2 3; do
                  if git pull --rebase origin main && git push origin HEAD:main; then
                    pushed=1
                    break
                  fi
                  sleep $(( attempt * 10 ))
                done
                if [ "$pushed" -ne 1 ]; then
                  echo "::warning::Closing snapshots remain local after three push attempts"
                fi
              fi
            )
            if [ "$remaining" -eq 0 ]; then break; fi
            sleep 300
          done
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"
      - name: Continue the same manually started monitoring session
        if: steps.monitor.outputs.remaining != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run capture-bet365-closing.yml --repo "$GITHUB_REPOSITORY" --ref main
