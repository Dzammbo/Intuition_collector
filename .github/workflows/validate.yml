name: Validate Public Operations

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'collector.py'
      - 'classify_universe.py'
      - 'collect_event_view.py'
      - 'l1_market_scan.py'
      - 'config/**'
      - 'triggers/run-validation.txt'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATE_REPO_TOKEN: ${{ secrets.JARVIS_PRIVATE_REPO_TOKEN }}
      BETSAPI_TOKEN: ${{ secrets.BETS_API }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Verify core public repository secrets
        run: |
          set -euo pipefail
          test -n "${PRIVATE_REPO_TOKEN:-}" || { echo "MISSING: JARVIS_PRIVATE_REPO_TOKEN"; exit 1; }
          test -n "${BETSAPI_TOKEN:-}" || { echo "MISSING: BETS_API"; exit 1; }
          echo "PRESENT: JARVIS_PRIVATE_REPO_TOKEN"
          echo "PRESENT: BETS_API"
          test -n "${TELEGRAM_BOT_TOKEN:-}" || { echo "MISSING: TELEGRAM_BOT_TOKEN"; exit 1; }
          test -n "${TELEGRAM_CHAT_ID:-}" || { echo "MISSING: TELEGRAM_CHAT_ID"; exit 1; }
          echo "PRESENT: TELEGRAM_BOT_TOKEN"
          echo "PRESENT: TELEGRAM_CHAT_ID"
      - name: Verify Telegram bot and target without publishing
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          def call(method, payload=None):
              url = f"https://api.telegram.org/bot{token}/{method}"
              data = urllib.parse.urlencode(payload or {}).encode()
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, data=data), timeout=25) as response:
                      body = json.load(response)
              except urllib.error.HTTPError as exc:
                  detail = json.loads(exc.read().decode("utf-8"))
                  raise SystemExit(f"Telegram {method} failed: {detail.get('description', 'HTTP error')}")
              assert body.get("ok") is True, method
              print(f"TELEGRAM_OK: {method}")
              return body["result"]
          bot = call("getMe")
          chat = call("getChat", {"chat_id": chat_id})
          print({"bot_username": bot.get("username"), "chat_type": chat.get("type"), "chat_title": chat.get("title")})
          PY
      - uses: actions/checkout@v4
        with:
          path: ops
      - uses: actions/checkout@v4
        with:
          repository: Dzammbo/jarvis-intuition
          token: ${{ secrets.JARVIS_PRIVATE_REPO_TOKEN }}
          path: state
      - name: Validate public workflow contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path("ops")
          workflows = root / ".github" / "workflows"
          required = {
              "collect.yml", "collect-event-view.yml", "l1-market-scan.yml",
              "build-model-prescreen-packet.yml", "reclassify-saved-universe.yml",
              "extract-unclassified.yml",
              "check-final-card-settlement.yml", "daily-settlement.yml",
              "rerender-results.yml", "telegram-native-publish.yml", "validate.yml",
          }
          present = {p.name for p in workflows.glob("*.yml")}
          assert present == required, (present, required)
          for path in workflows.glob("*.yml"):
              body = path.read_text(encoding="utf-8")
              assert "runs-on: ubuntu-latest" in body, path
              if path.name != "validate.yml":
                  assert "self-hosted" not in body, path
                  for forbidden in ("vercel", "railway", "selectel"):
                      assert forbidden not in body.lower(), (path, forbidden)
          private_workflows = sorted(p.name for p in Path("state/.github/workflows").glob("*.yml"))
          assert not private_workflows, private_workflows
          print({"private_workflows": private_workflows})
          PY
      - name: Verify private repository write permission
        working-directory: state
        run: git push --dry-run origin HEAD:main
      - name: Validate private state contracts
        working-directory: state
        run: |
          python3 scripts/validate_repository.py
          python3 -m compileall -q collectors models scripts tests
          python3 -m unittest discover -s tests -p 'test_*.py'
