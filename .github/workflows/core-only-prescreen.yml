name: Persist CORE-only Model Pre-Screen

on:
  push:
    branches: [main]
    paths: ['triggers/run-core-only-prescreen.txt']

permissions:
  contents: read
  actions: read

jobs:
  prescreen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Resolve explicit inputs
        run: |
          set -euo pipefail
          echo "L1_RUN=$(sed -n '1p' triggers/run-core-only-prescreen.txt)" >> "$GITHUB_ENV"
          echo "VIEW_RUN=$(sed -n '2p' triggers/run-core-only-prescreen.txt)" >> "$GITHUB_ENV"
          echo "DAY=$(sed -n '3p' triggers/run-core-only-prescreen.txt)" >> "$GITHUB_ENV"
          echo "STAMP=$(sed -n '4p' triggers/run-core-only-prescreen.txt)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: Dzammbo/jarvis-intuition
          token: ${{ secrets.JARVIS_PRIVATE_REPO_TOKEN }}
          path: private
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.L1_RUN }}
          name: l1-market-scan-${{ env.DAY }}
          path: l1
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.VIEW_RUN }}
          name: event-view-core-${{ env.DAY }}
          path: view
      - name: Build and validate CORE-only substantive pre-screen
        run: |
          set -euo pipefail
          zip -j l1.zip l1/l1-market-raw.json
          zip -j view.zip view/event-view-core.json
          python3 private/scripts/build_core_only_model_prescreen_2026_10_03.py \
            --l1-zip l1.zip \
            --event-view-zip view.zip \
            --out-dir private/core-prescreen-output \
            --timestamp-utc "$STAMP"
          python3 private/scripts/validate_model_prescreen.py \
            private/core-prescreen-output/model-prescreen-packet-core-only.json \
            private/core-prescreen-output/model-pre-screen-ledger-core-only.json
          mkdir -p "private/candidate_screen_inputs/$DAY" "private/candidate_screen_outputs/$DAY"
          mv private/core-prescreen-output/model-prescreen-packet-core-only.json \
            "private/candidate_screen_inputs/$DAY/model-prescreen-packet-core-only.json"
          mv private/core-prescreen-output/model-pre-screen-ledger-core-only.json \
            "private/candidate_screen_outputs/$DAY/model-pre-screen-ledger-core-only.json"
      - name: Persist canonical pre-screen state
        working-directory: private
        run: |
          set -euo pipefail
          git config user.name "Jarvis Intuition Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "candidate_screen_inputs/$DAY/model-prescreen-packet-core-only.json" \
                  "candidate_screen_outputs/$DAY/model-pre-screen-ledger-core-only.json"
          git commit -m "Persist $DAY CORE-only substantive pre-screen"
          git push
