name: Collect Universe

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'triggers/run-universe.txt'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BETSAPI_TOKEN: ${{ secrets.BETS_API }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          test -n "${BETSAPI_TOKEN:-}"
          python3 collector.py
      - name: Classify canonical 24h Universe
        if: success()
        run: python3 classify_universe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universe
          path: |
            universe.json
            classified-universe.json
          if-no-files-found: error
          retention-days: 1
