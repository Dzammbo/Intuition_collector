name: Recover Bet365 Closing Monitor

on:
  workflow_run:
    workflows: ["Capture Bet365 Closing Line (Manual)"]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: capture-bet365-closing-guard
  cancel-in-progress: false

jobs:
  recover:
    if: contains(fromJSON('["failure","timed_out","startup_failure","stale"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BETSAPI_TOKEN: ${{ secrets.BETS_API }}
      STATE_ROOT: state
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ops
      - uses: actions/checkout@v4
        with:
          repository: Dzammbo/jarvis-intuition
          token: ${{ secrets.JARVIS_PRIVATE_REPO_TOKEN }}
          path: state
      - name: Validate recovery code
        working-directory: ops
        run: python3 -m unittest -v test_capture_bet365_closing.py
      - name: Refresh closing state
        id: refresh
        continue-on-error: true
        run: python3 ops/capture_bet365_closing.py
      - name: Persist recovered snapshot
        if: steps.refresh.outcome == 'success'
        working-directory: state
        run: |
          set -euo pipefail
          git config user.name "jarvis-intuition-bot"
          git config user.email "jarvis-intuition-bot@users.noreply.github.com"
          git add diagnostics/bet365_closing/
          if [ -d closing_line_snapshots ]; then git add closing_line_snapshots/; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Recover Bet365 closing-line monitor"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $(( attempt * 10 ))
          done
          exit 1
      - name: Restart monitor when targets remain
        if: always()
        run: |
          set -euo pipefail
          if [ -f state/diagnostics/bet365_closing/latest.json ]; then
            remaining=$(python3 -c 'import json; print(json.load(open("state/diagnostics/bet365_closing/latest.json")).get("targets_open", 1))')
          else
            remaining=1
          fi
          active=-1
          for attempt in 1 2 3; do
            if active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow capture-bet365-closing.yml --limit 20 --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "requested" or .status == "pending")] | length'); then break; fi
            sleep $(( attempt * 10 ))
          done
          if [ "$active" -lt 0 ]; then exit 1; fi
          if [ "$remaining" -gt 0 ] && [ "$active" -eq 0 ]; then
            for attempt in 1 2 3; do
              if gh workflow run capture-bet365-closing.yml --repo "$GITHUB_REPOSITORY" --ref main; then exit 0; fi
              sleep $(( attempt * 10 ))
            done
            exit 1
          fi
