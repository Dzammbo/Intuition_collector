name: Reclassify Saved Universe
on:
  push:
    branches: [main]
    paths: ['triggers/run-reclassify-saved.txt']
permissions:
  contents: read
  actions: read
jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: universe
          github-token: ${{ github.token }}
          run-id: 36379808382
      - name: Restore raw universe filename
        run: |
          test -f universe.json || { echo "universe.json missing"; exit 1; }
      - run: python3 classify_universe.py
      - uses: actions/upload-artifact@v4
        with:
          name: final-universe-2026-09-28
          path: classified-universe.json
          retention-days: 7
