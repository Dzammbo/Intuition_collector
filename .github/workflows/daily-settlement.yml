name: Daily Settlement

on:
  workflow_dispatch:
    inputs:
      date_moscow:
        description: YYYY-MM-DD, blank means yesterday in Moscow
        required: false
        type: string
      settlement_scope:
        description: fast for portfolio-only intermediate, full for overnight learning settlement
        required: false
        default: full
        type: choice
        options: [full, fast]
  push:
    branches: [main]
    paths: [triggers/run-settlement-check.txt]

permissions:
  contents: read
  actions: read

concurrency:
  group: public-daily-settlement
  cancel-in-progress: true

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BETSAPI_TOKEN: ${{ secrets.BETS_API }}
      PRIVATE_REPO_TOKEN: ${{ secrets.JARVIS_PRIVATE_REPO_TOKEN }}
    steps:
      - name: Verify required secrets
        run: |
          set -euo pipefail
          test -n "${BETSAPI_TOKEN:-}" || { echo "BETS_API secret is missing"; exit 1; }
          test -n "${PRIVATE_REPO_TOKEN:-}" || { echo "JARVIS_PRIVATE_REPO_TOKEN secret is missing"; exit 1; }
      - uses: actions/checkout@v4
        with:
          path: ops
      - uses: actions/checkout@v4
        with:
          repository: Dzammbo/jarvis-intuition
          token: ${{ secrets.JARVIS_PRIVATE_REPO_TOKEN }}
          path: state
      - name: Resolve settlement request
        id: request
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            D=$(grep -Eo '^[0-9]{4}-[0-9]{2}-[0-9]{2}' ops/triggers/run-settlement-check.txt | head -1 || true)
            PURPOSE=$(sed -n 's/^purpose=//p' ops/triggers/run-settlement-check.txt | head -1)
            if [[ "$PURPOSE" == *intermediate* ]]; then SCOPE=fast; else SCOPE=full; fi
          else
            D="${{ inputs.date_moscow }}"
            SCOPE="${{ inputs.settlement_scope }}"
          fi
          if [ -z "$D" ]; then D=$(TZ=Europe/Moscow date -d yesterday +%F); fi
          if [ -z "$SCOPE" ]; then SCOPE=full; fi
          [[ "$D" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$SCOPE" =~ ^(fast|full)$ ]]
          echo "date=$D" >> "$GITHUB_OUTPUT"
          echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"
      - name: Download exact model pre-screen packet
        if: steps.request.outputs.scope == 'full'
        id: packet
        run: |
          set -euo pipefail
          D="${{ steps.request.outputs.date }}"
          RUN_ID=$(python3 - <<'PY'
          import glob,json,os
          day=os.environ["DAY"]
          ids=set()
          for path in glob.glob(f"state/assessment_checkpoints/{day}/batch-*-candidates-*.json"):
              with open(path,encoding="utf-8") as f:
                  value=json.load(f).get("source_packet_run_id")
              if value is not None: ids.add(str(value))
          if len(ids)!=1:
              raise SystemExit(f"expected exactly one source_packet_run_id for {day}, found {sorted(ids)}")
          print(next(iter(ids)))
          PY
          )
          PACKET_DIR="$RUNNER_TEMP/model-packet-$D"
          mkdir -p "$PACKET_DIR"
          gh run download "$RUN_ID" --repo Dzammbo/Intuition_collector \
            --name "model-prescreen-packet-$D" --dir "$PACKET_DIR"
          test -s "$PACKET_DIR/model-prescreen-packet.json"
          echo "path=$PACKET_DIR/model-prescreen-packet.json" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ steps.request.outputs.date }}
      - name: Build full assessment learning population
        if: steps.request.outputs.scope == 'full'
        working-directory: state
        run: |
          set -euo pipefail
          python3 scripts/build_learning_population.py \
            --date "${{ steps.request.outputs.date }}" \
            --model-packet "${{ steps.packet.outputs.path }}"
      - name: Fast portfolio-only settlement
        if: steps.request.outputs.scope == 'fast'
        working-directory: state
        run: |
          set -euo pipefail
          D="${{ steps.request.outputs.date }}"
          python3 scripts/settle_portfolio_fast.py --date-moscow "$D"
          test -f "settlements/$D.json"
          python3 scripts/build_bankroll_performance.py
          python3 scripts/render_settlement_report.py --date "$D"
      - name: Full overnight settlement
        if: steps.request.outputs.scope == 'full'
        working-directory: state
        run: |
          set -euo pipefail
          D="${{ steps.request.outputs.date }}"
          python3 scripts/settle_daily_batches.py --date-moscow "$D"
          test -f "settlements/$D.json"
          python3 scripts/build_shadow_diagnostics.py --date "$D"
          python3 scripts/build_bankroll_performance.py
          python3 scripts/render_settlement_report.py --date "$D"
      - name: Commit state to private repository
        working-directory: state
        run: |
          set -euo pipefail
          git config user.name "jarvis-intuition-bot"
          git config user.email "jarvis-intuition-bot@users.noreply.github.com"
          mkdir -p settlements telegram_reports
          git add learning/ settlements/ diagnostics/ performance/ telegram_reports/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Settle Jarvis Intuition daily batches"
          git pull --rebase origin main
          git push origin HEAD:main
